# HC Waybill on your own machine, using the MariaDB server you already run.
#
#   docker load -i hc-waybill-image.tar.gz     (once per new version)
#   docker compose up -d                       → http://localhost:8080
#
# The settings (database, RS.ge, SMS) are in .env (copy .env.example). See README.md.
services:
  app:
    image: hc-waybill:latest
    env_file: .env
    ports:
      # Change the first number to serve on another port, e.g. '80:80'.
      - '8080:80'
    # Lets the container reach MariaDB on this machine as "host.docker.internal" (Linux too).
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
