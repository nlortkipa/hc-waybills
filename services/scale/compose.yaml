# Scale Service stack: vendor Web.API + SQL Server with the vendor database
# attached + a read-only table inspector for the website.
#
#   cp services/scale/.env.example services/scale/.env   # then edit
#   npm run scale up
name: hc-scale

services:
  scale-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set in services/scale/.env}
      SCALE_DB_NAME: ${SCALE_DB_NAME:-HCG-SCALES}
      SCALE_API_DB_PASSWORD: ${SCALE_API_DB_PASSWORD:?set in services/scale/.env}
      INSPECTOR_DB_PASSWORD: ${INSPECTOR_DB_PASSWORD:?set in services/scale/.env}
    command: ["bash", "/init/entrypoint.sh"]
    volumes:
      - scale-db-data:/var/opt/mssql
      - ./db:/init:ro
      - ${SCALE_VENDOR_DIR:?set in services/scale/.env}/DBi:/seed:ro
    ports:
      - "127.0.0.1:${SCALE_DB_PORT:-14330}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U inspector -P \"$$INSPECTOR_DB_PASSWORD\" -C -d \"$$SCALE_DB_NAME\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  scale-api:
    image: hc/scale-api:local
    build:
      context: ./api
      additional_contexts:
        vendor: ${SCALE_VENDOR_DIR}
    environment:
      ASPNETCORE_ENVIRONMENT: ${SCALE_API_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Server=scale-db,1433;Database=${SCALE_DB_NAME:-HCG-SCALES};User Id=scale_api;Password=${SCALE_API_DB_PASSWORD};TrustServerCertificate=True;
      Jwt__Key: ${SCALE_JWT_KEY:?set in services/scale/.env}
      # The vendor appsettings has 000010, which isn't in this DB's Companies table,
      # so every start request fails "seller company code not found".
      SAP__StaticData__SellerCompanyCode: ${SCALE_SELLER_COMPANY_CODE:-230866435}
    volumes:
      - ./config/Integration.dll.config:/app/Integration.dll.config:ro
    ports:
      - "127.0.0.1:${SCALE_API_PORT:-5080}:8080"
    depends_on:
      scale-db:
        condition: service_healthy

  scale-inspector:
    image: hc/scale-inspector:local
    build: ./inspector
    environment:
      DB_HOST: scale-db
      DB_NAME: ${SCALE_DB_NAME:-HCG-SCALES}
      DB_USER: inspector
      DB_PASSWORD: ${INSPECTOR_DB_PASSWORD}
      SCALE_API_URL: http://scale-api:8080
      ALLOW_ORIGIN: ${INSPECTOR_ALLOW_ORIGIN:-*}
    ports:
      - "127.0.0.1:${SCALE_INSPECTOR_PORT:-5081}:8080"
    depends_on:
      scale-db:
        condition: service_healthy

volumes:
  scale-db-data:
